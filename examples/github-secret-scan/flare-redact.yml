name: Flare Redact

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scan project text files
        run: npx --yes --package flare-redact@1.5.1 flare-redact --scan . --exclude package-lock.json
