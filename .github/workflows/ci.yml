name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - if: matrix.node == 24
        run: npm pack --dry-run
      - if: matrix.node == 24
        run: npm run benchmark:adversarial
      - if: matrix.node == 24
        run: npm --prefix examples/openai-privacy install
      - if: matrix.node == 24
        run: npm --prefix examples/openai-privacy start
      - if: matrix.node == 24
        run: npm --prefix examples/express-pino install
      - if: matrix.node == 24
        run: npm --prefix examples/express-pino run smoke
      - if: matrix.node == 24
        run: npm --prefix examples/universal-boundaries install
      - if: matrix.node == 24
        run: npm --prefix examples/universal-boundaries start

  runtimes:
    name: Bun & Deno smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/runtime-smoke.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read scripts/runtime-smoke.mjs

  spec:
    name: Detector pack is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Each SDK embeds the pack next to its own code; this fails if a copy has
      # drifted from spec/detectors.json.
      - run: node scripts/sync-spec.mjs --check

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest discover -s sdk/python/tests -t sdk/python
        env:
          PYTHONPATH: sdk/python/src
      - name: Build the distribution
        if: matrix.python == '3.13'
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
        working-directory: sdk/go
      - run: go test ./...
        working-directory: sdk/go

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: sdk/rust
      - run: cargo test
        working-directory: sdk/rust

  gateway-image:
    name: Gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: flare-redact-gateway:ci
      - name: The image starts and answers /healthz
        run: |
          docker run -d --name gateway -p 8787:8787 \
            -e FLARE_GATEWAY_HOST=0.0.0.0 \
            flare-redact-gateway:ci --upstream https://api.openai.com
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then
              echo "gateway is healthy"
              docker rm -f gateway
              exit 0
            fi
            sleep 1
          done
          docker logs gateway
          docker rm -f gateway
          exit 1

  publish:
    name: Publish npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, runtimes, spec, python, go, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - id: version
        name: Check registry version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version will be published"
          fi
      - if: steps.version.outputs.publish == 'true'
        name: Verify npm provenance repository
        env:
          EXPECTED_REPOSITORY: https://github.com/${{ github.repository }}
        run: >-
          node -e "const p = require('./package.json');
          const expected = 'git+' + process.env.EXPECTED_REPOSITORY + '.git';
          if (p.repository?.url !== expected) {
            throw new Error('package.json repository.url must be ' + expected +
            ' for npm provenance, received ' + p.repository?.url);
          }"
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
