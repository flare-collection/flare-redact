name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - if: matrix.node == 24
        run: npm pack --dry-run
      - if: matrix.node == 24
        run: npm run benchmark:adversarial
      - if: matrix.node == 24
        run: npm run benchmark:agent -- --json
      - if: matrix.node == 24
        run: npm --prefix examples/openai-privacy install
      - if: matrix.node == 24
        run: npm --prefix examples/openai-privacy start
      - if: matrix.node == 24
        run: npm --prefix examples/ai-sdk install
      - if: matrix.node == 24
        run: npm --prefix examples/ai-sdk start
      - if: matrix.node == 24
        run: npm --prefix examples/express-pino install
      - if: matrix.node == 24
        run: npm --prefix examples/express-pino run smoke
      - if: matrix.node == 24
        run: npm --prefix examples/universal-boundaries install
      - if: matrix.node == 24
        run: npm --prefix examples/universal-boundaries start
      - if: matrix.node == 24
        run: npm --prefix examples/flareflow-agent install
      - if: matrix.node == 24
        run: npm --prefix examples/flareflow-agent start
      - if: matrix.node == 24
        run: npm --prefix examples/nemo-guardrails-flareflow install
      - if: matrix.node == 24
        run: npm --prefix examples/nemo-guardrails-flareflow start

  runtimes:
    name: Bun & Deno smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/runtime-smoke.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read scripts/runtime-smoke.mjs

  # The CLI reads people's own paths and repositories: --scan walks the file
  # tree, --staged reads git, and init --hook writes into .git. Run the whole
  # suite where those differ most from Linux.
  platforms:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  spec:
    name: Detector pack is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Each SDK embeds the pack next to its own code; this fails if a copy has
      # drifted from spec/detectors.json.
      - run: node scripts/sync-spec.mjs --check

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest moved to 26.04, which has no Python 3.9 build. The SDK
          # still supports 3.9, so that job stays on 24.04.
          - python: '3.9'
            os: ubuntu-24.04
          - python: '3.11'
            os: ubuntu-latest
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The data frame tests skip without these; run them on one version.
      - name: Install the optional data frame libraries
        if: matrix.python == '3.13'
        run: python -m pip install pandas polars duckdb
      - name: Run the test suite
        run: python -m unittest discover -s sdk/python/tests -t sdk/python
        env:
          PYTHONPATH: sdk/python/src
      - name: Build the distribution
        if: matrix.python == '3.13'
        run: |
          python -m pip install --upgrade build twine
          python -m build sdk/python
          python -m twine check --strict sdk/python/dist/*
      # Install the wheel the way a user would, outside the source tree, so a
      # missing detector pack or module fails here rather than on PyPI.
      - name: The wheel installs and redacts
        if: matrix.python == '3.13'
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-check
          wheel-check/bin/pip install "$GITHUB_WORKSPACE"/sdk/python/dist/*.whl
          wheel-check/bin/python -c "
          import flare_redact
          out = flare_redact.redact('key AKIAIOSFODNN7EXAMPLE')
          assert out == 'key AKIA***', out
          print(flare_redact.__version__, out)
          "
          wheel-check/bin/flare-redact --help >/dev/null

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
        working-directory: sdk/go
      - run: go test ./...
        working-directory: sdk/go

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: sdk/rust
      - run: cargo test
        working-directory: sdk/rust
      # Build the crate from the files crates.io would receive, so a file left
      # out of the package fails the pull request rather than the release.
      - name: The packaged crate builds
        run: |
          cargo package --list --locked
          cargo package --locked
        working-directory: sdk/rust

  java:
    name: Java SDK (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is the oldest release the jar targets; 21 is the current LTS.
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp verify
        working-directory: sdk/java
      # Build the jars Maven Central would receive (sources and javadoc too, with
      # doclint on), so a broken release artifact fails the pull request.
      - name: The release artifacts build
        if: matrix.java == '21'
        run: mvn -B -ntp -P release -Dgpg.skip=true -DskipTests package
        working-directory: sdk/java

  dotnet:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test sdk/dotnet/FlareRedact.sln -c Release
      # The same suite against the netstandard2.0 build, which has its own code
      # paths for astral letters and no System.Text.Json support.
      - run: dotnet test sdk/dotnet/tests/FlareRedact.Tests -c Release -p:FlareTarget=netstandard2.0
      - run: dotnet pack sdk/dotnet/FlareRedact.sln -c Release -o sdk/dotnet/artifacts

  fluent-bit:
    name: Fluent Bit WASM filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/fluent-bit
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: sdk/fluent-bit
      - run: cargo test
        working-directory: sdk/fluent-bit
      - run: cargo build --release --target wasm32-wasip1
        working-directory: sdk/fluent-bit
      # Run the filter in the official Fluent Bit image, the way users will.
      - name: Fluent Bit redacts records with the filter
        run: sdk/fluent-bit/smoke-test.sh

  gateway-image:
    name: Gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: flare-redact-gateway:ci
      - name: The image starts and answers /healthz
        run: |
          docker run -d --name gateway -p 8787:8787 \
            -e FLARE_GATEWAY_HOST=0.0.0.0 \
            flare-redact-gateway:ci --upstream https://api.openai.com
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then
              echo "gateway is healthy"
              docker rm -f gateway
              exit 0
            fi
            sleep 1
          done
          docker logs gateway
          docker rm -f gateway
          exit 1

  action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # The action runs a release from npm by default; point it at this commit
      # instead, so the code under review is what gets tested.
      - name: Pack this commit
        id: pack
        shell: bash
        run: echo "tarball=$GITHUB_WORKSPACE/$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Write fixtures
        shell: bash
        run: |
          mkdir -p action-fixtures/leaky action-fixtures/clean
          node -e "process.stdout.write('deploy key: ghp_' + 'a'.repeat(36) + '\\n')" > action-fixtures/leaky/config.txt
          echo 'nothing to see here' > action-fixtures/clean/readme.txt
      - name: Scan a clean directory
        id: clean
        uses: ./
        with:
          path: action-fixtures/clean
          version: ${{ steps.pack.outputs.tarball }}
      - name: Scan a leaky directory, report only
        id: report
        uses: ./
        with:
          path: action-fixtures/leaky
          version: ${{ steps.pack.outputs.tarball }}
          fail-on-findings: 'false'
          annotate: 'false'
      - name: Scan a leaky directory, expecting the step to fail
        id: leaky
        continue-on-error: true
        uses: ./
        with:
          path: action-fixtures/leaky
          version: ${{ steps.pack.outputs.tarball }}
          annotate: 'false'
      - name: Check the results
        shell: bash
        env:
          CLEAN: ${{ steps.clean.outputs.findings }}
          REPORTED: ${{ steps.report.outputs.findings }}
          SARIF: ${{ steps.report.outputs.sarif-file }}
          LEAKY: ${{ steps.leaky.outcome }}
        run: |
          set -x
          test "$CLEAN" = 0
          test "$REPORTED" = 1
          grep -q '"ruleId": "github_token"' "$SARIF"
          if grep -q 'aaaaaaaaaaaaaaaa' "$SARIF"; then echo "the SARIF report contains the value"; exit 1; fi
          test "$LEAKY" = failure

  publish:
    name: Publish npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, platforms, runtimes, spec, python, go, rust, java, dotnet, fluent-bit, action]
    runs-on: ubuntu-latest
    permissions:
      # npm Trusted Publishing: the job proves it is this workflow with an OIDC
      # token, so no long-lived npm token is stored in the repository.
      id-token: write
      # Create the version tag and GitHub Release after a successful publish.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - id: version
        name: Check registry version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version will be published"
          fi
      - if: steps.version.outputs.publish == 'true'
        name: Verify npm provenance repository
        env:
          EXPECTED_REPOSITORY: https://github.com/${{ github.repository }}
        run: >-
          node -e "const p = require('./package.json');
          const expected = 'git+' + process.env.EXPECTED_REPOSITORY + '.git';
          if (p.repository?.url !== expected) {
            throw new Error('package.json repository.url must be ' + expected +
            ' for npm provenance, received ' + p.repository?.url);
          }"
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - if: steps.version.outputs.publish == 'true'
        name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already has a GitHub Release"
            exit 0
          fi
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "flare-redact v$VERSION" --notes-file release-notes.md
      # `uses: flare-collection/flare-redact@v1` follows the latest release of
      # the same major version, the way GitHub Actions are usually consumed.
      - if: steps.version.outputs.publish == 'true'
        name: Point the major tag of the GitHub Action at this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in *-*) echo "prerelease: v${VERSION%%.*} stays where it is"; exit 0 ;; esac
          major="v${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  # The Go module lives in sdk/go, so Go only sees a release through a tag named
  # sdk/go/vX.Y.Z. Without one, `go get` and pkg.go.dev fall back to
  # pseudo-versions. This points sdk/go/vX.Y.Z at the commit vX.Y.Z names, and
  # runs on every push, so a release made before this job existed gets its tag.
  go-tag:
    name: Tag the Go module
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sdk/go/v$VERSION" >/dev/null 2>&1; then
            echo "sdk/go/v$VERSION already exists"
            exit 0
          fi
          if ! sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null)"; then
            echo "v$VERSION is not tagged yet, so there is nothing to point sdk/go/v$VERSION at"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/sdk/go/v$VERSION" -f sha="$sha" >/dev/null
          echo "tagged sdk/go/v$VERSION at $sha"

  # The Fluent Bit filter is attached to the GitHub Release it was built for,
  # only from the commit that release points at.
  fluent-bit-asset:
    name: Attach the Fluent Bit filter
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          released="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null || true)"
          if [ "$released" != "$GITHUB_SHA" ]; then
            echo "v$VERSION is not this commit, so this push is not a release"
            echo "attach=false" >> "$GITHUB_OUTPUT"
          else
            echo "attach=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.attach == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - if: steps.check.outputs.attach == 'true'
        run: cargo build --release --target wasm32-wasip1 --locked
        working-directory: sdk/fluent-bit
      - if: steps.check.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cp sdk/fluent-bit/target/wasm32-wasip1/release/flare_redact_fluent_bit.wasm flare-redact-fluent-bit.wasm
          sha256sum flare-redact-fluent-bit.wasm > flare-redact-fluent-bit.wasm.sha256
          gh release upload "v$VERSION" flare-redact-fluent-bit.wasm flare-redact-fluent-bit.wasm.sha256 --clobber

  # The Python, Rust, Java and .NET engines ship only from the commit npm released: vX.Y.Z,
  # created by the publish job, has to point at this commit. A later push that
  # leaves the version alone publishes nothing, so a registry never receives
  # unreleased code under an already released version number. Re-running a
  # release run retries whichever registry failed.
  sdk-release:
    name: SDK release check
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pypi: ${{ steps.check.outputs.pypi }}
      crates: ${{ steps.check.outputs.crates }}
      maven: ${{ steps.check.outputs.maven }}
      nuget: ${{ steps.check.outputs.nuget }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          released="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null || true)"
          if [ "$released" != "$GITHUB_SHA" ]; then
            echo "v$VERSION is not this commit, so this push is not a release"
            echo "pypi=false" >> "$GITHUB_OUTPUT"
            echo "crates=false" >> "$GITHUB_OUTPUT"
            echo "maven=false" >> "$GITHUB_OUTPUT"
            echo "nuget=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 200: this version is already there. 404: it is not. Anything else is
          # an outage, and publishing on a guess is worse than failing.
          check() {
            registry="$1" url="$2" key="$3"
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "flare-redact release check (https://github.com/$GITHUB_REPOSITORY)" "$url")"
            case "$status" in
              200) echo "$key=false" >> "$GITHUB_OUTPUT"; echo "flare-redact $VERSION is already on $registry" ;;
              404) echo "$key=true" >> "$GITHUB_OUTPUT"; echo "flare-redact $VERSION will be published to $registry" ;;
              *) echo "$registry answered HTTP $status for $url" >&2; return 1 ;;
            esac
          }
          check PyPI "https://pypi.org/pypi/flare-redact/$VERSION/json" pypi
          check crates.io "https://crates.io/api/v1/crates/flare-redact/$VERSION" crates
          check "Maven Central" "https://repo1.maven.org/maven2/io/github/flare-collection/flare-redact/$VERSION/flare-redact-$VERSION.pom" maven
          check NuGet "https://api.nuget.org/v3-flatcontainer/flareredact/$VERSION/flareredact.nuspec" nuget

  publish-python:
    name: Publish PyPI
    needs: [sdk-release]
    if: needs.sdk-release.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flare-redact/
    permissions:
      # PyPI Trusted Publishing: the job proves it is this workflow with an OIDC
      # token, so no PyPI token is stored in the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade build
          python -m build sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  publish-rust:
    name: Publish crates.io
    needs: [sdk-release]
    if: needs.sdk-release.outputs.crates == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/flare-redact
    permissions:
      # crates.io Trusted Publishing, through rust-lang/crates-io-auth-action.
      id-token: write
      contents: read
    env:
      # crates.io accepts Trusted Publishing only for a crate that already
      # exists, so the first release needs an API token: store it as the
      # CARGO_REGISTRY_TOKEN secret of the crates-io environment, add the
      # trusted publisher once the crate exists, then delete the secret.
      HAS_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - if: env.HAS_CRATES_TOKEN != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  publish-java:
    name: Publish Maven Central
    needs: [sdk-release]
    if: needs.sdk-release.outputs.maven == 'true'
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.flare-collection/flare-redact
    permissions:
      contents: read
    env:
      # Maven Central has no trusted publishing: it needs a Central Portal user
      # token and a GPG key whose public half is on a key server. Until the
      # secrets exist on the maven-central environment, this job says so and
      # publishes nothing.
      HAS_SECRETS: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.MAVEN_CENTRAL_PASSWORD != '' && secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Maven Central secrets are not configured; the Java SDK was not published"
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_SECRETS == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      - if: env.HAS_SECRETS == 'true'
        run: mvn -B -ntp -P release deploy
        working-directory: sdk/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-dotnet:
    name: Publish NuGet
    needs: [sdk-release]
    if: needs.sdk-release.outputs.nuget == 'true'
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/FlareRedact
    permissions:
      contents: read
    env:
      # A nuget.org API key scoped to the FlareRedact packages, stored on the
      # nuget environment. Without it this job says so and publishes nothing.
      HAS_SECRETS: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - if: env.HAS_SECRETS != 'true'
        run: echo "::notice::NUGET_API_KEY is not configured; the .NET SDK was not published"
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_SECRETS == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - if: env.HAS_SECRETS == 'true'
        run: dotnet pack sdk/dotnet/FlareRedact.sln -c Release -o sdk/dotnet/artifacts
      # --skip-duplicate lets a re-run finish a release that failed half way.
      - if: env.HAS_SECRETS == 'true'
        run: >-
          dotnet nuget push "sdk/dotnet/artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
