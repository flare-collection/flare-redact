[package]
name = "flare-redact"
version = "1.5.0"
edition = "2021"
rust-version = "1.70"
description = "Secret and PII redaction for logs, prompts and any JSON value, implementing the portable FRS-1 detector specification."
license = "MIT"
readme = "README.md"
repository = "https://github.com/flare-collection/flare-redact"
homepage = "https://flare-collection.github.io/flare-redact/"
documentation = "https://docs.rs/flare-redact"
keywords = ["redaction", "pii", "secrets", "privacy", "masking"]
categories = ["text-processing", "web-programming", "development-tools"]
exclude = ["/tests/fixtures"]

[dependencies]
# regex gives a linear-time engine with no backtracking, which is exactly what a
# redactor scanning untrusted input needs. serde_json is the value model this
# crate redacts; its default Map is a BTreeMap, so traversal order is sorted and
# therefore identical to the other FRS-1 engines.
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
