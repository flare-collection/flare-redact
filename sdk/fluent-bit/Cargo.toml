[package]
name = "flare-redact-fluent-bit"
version = "1.13.0"
edition = "2021"
rust-version = "1.70"
description = "A Fluent Bit WASM filter that redacts secrets and PII from every record, built on the flare-redact Rust engine."
license = "MIT"
repository = "https://github.com/flare-collection/flare-redact"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flare-redact = { path = "../rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
